<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nest UK</title>
<meta name="description" content="Check crime, flood risk, schools, shops, sport and main roads around any address in England, Wales or Northern Ireland before you rent or buy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Layout: one report column. Search card, topic tabs, one card per address per topic, one shared map. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --surface-2:#f4f6f8; --ink:#12202c; --muted:#566676; --line:#d3dbe2;
  --accent:#1a4fb8; --accent-ink:#ffffff; --focus:#ffb000;
  --good:#23865f; --ok:#7d9a1f; --warn:#c98210; --bad:#cc4a28; --severe:#9a1e3c;
  --a:#2563eb; --b:#7c3aed; --c:#0e8aa6;
  --g-home:#d6336c; --g-vehicle:#f08c00; --g-person:#7048e8; --g-nuisance:#1098ad; --g-other:#868e96;
  --display:"Bricolage Grotesque","Noto Sans TC","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  --body:"Public Sans","Noto Sans TC","PingFang HK","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c141c; --surface:#131f2a; --surface-2:#1a2937; --ink:#e6edf3; --muted:#93a4b4; --line:#273746;
    --accent:#7aaeff; --accent-ink:#0c141c;
    --good:#46c28f; --ok:#a7c63f; --warn:#f0a82e; --bad:#f0714f; --severe:#ef5b7c;
    --a:#6ea0ff; --b:#b394ff; --c:#3cc1de; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c141c; --surface:#131f2a; --surface-2:#1a2937; --ink:#e6edf3; --muted:#93a4b4; --line:#273746;
  --accent:#7aaeff; --accent-ink:#0c141c;
  --good:#46c28f; --ok:#a7c63f; --warn:#f0a82e; --bad:#f0714f; --severe:#ef5b7c;
  --a:#6ea0ff; --b:#b394ff; --c:#3cc1de; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.brand b{font:800 19px/1 var(--display);letter-spacing:-.01em;display:block}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);flex:none}
.lang button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:8px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* hero */
h1{font:800 clamp(30px,6.2vw,54px)/1.02 var(--display);letter-spacing:-.025em;margin:0 0 14px;text-wrap:balance;max-width:16ch}
.lede{color:var(--muted);max-width:64ch;margin:0 0 22px;font-size:16px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
label.cap,.cap{font:600 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* form */
.addr{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center}
.addr+.addr{margin-top:10px}
.chip{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;color:#fff;font:700 14px var(--display);flex:none}
.chip.a{background:var(--a)} .chip.b{background:var(--b)} .chip.c{background:var(--c)}
:root[data-theme="dark"] .chip{color:#0c141c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip{color:#0c141c}}
input[type=text],select{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:16px var(--body);padding:0 12px}
.linkbtn{background:none;border:0;color:var(--accent);font:600 14px var(--body);padding:10px 0;cursor:pointer}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:14px}
.opt{display:flex;flex-direction:column;gap:8px;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{flex:1;position:relative;min-width:0}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:11px 6px;font:600 13px/1.25 var(--body);color:var(--muted);border-left:1px solid var(--line)}
.seg label:first-child span{border-left:0}
.seg input:checked+span{background:var(--ink);color:var(--bg)}
.seg input:focus-visible+span{outline:3px solid var(--focus);outline-offset:-3px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px}
.btn{height:46px;padding:0 22px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 15px var(--body);cursor:pointer}
.btn[disabled]{opacity:.55;cursor:progress}
.ex{font-size:13px;color:var(--muted)}
.ex button{background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font:500 13px var(--body);cursor:pointer;margin-left:6px}
.msg{color:var(--bad);font-weight:600;margin:12px 0 0}

/* intro */
.get{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.get div{border-top:2px solid var(--line);padding-top:10px}
.get b{display:block;font:700 15px var(--display);margin-bottom:4px}
.get span{color:var(--muted);font-size:13.5px}

/* status */
.st{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center}
.st+.st{margin-top:12px}
.st p{margin:0;font-size:14px;overflow-wrap:anywhere}
.st .mods{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;color:var(--muted);font-size:13px}
.st .mods .ok{color:var(--good)} .st .mods .err{color:var(--bad)}
.st .track{height:6px;background:var(--surface-2);border-radius:9px;margin-top:8px;overflow:hidden}
.st .track i{display:block;height:100%;background:var(--accent);width:0}

/* topic tabs */
.topics{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.topics button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:9px 16px;font:600 14px var(--body);cursor:pointer;white-space:nowrap}
.topics button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* tables */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:13px}
thead th{vertical-align:bottom}
td.v{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
td.best{font-weight:700}
td.best small{display:inline-block;margin-left:6px;font:600 10px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--good)}
tr.grp th{background:var(--surface-2);color:var(--ink);font:700 12px var(--body);letter-spacing:.06em;text-transform:uppercase}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--band,var(--muted));color:#fff;font:700 12px/1.3 var(--body)}
:root[data-theme="dark"] .pill{color:#0c141c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill{color:#0c141c}}
.pill.b1,.pill.b2{color:#1b1400}
h3.sec{font:700 14px var(--display);margin:0 0 12px;letter-spacing:.01em}

/* report */
.rhead{display:flex;align-items:center;gap:12px}
.rhead h2{font:800 22px/1.15 var(--display);margin:0;letter-spacing:-.01em;overflow-wrap:anywhere}
.rhead p{margin:2px 0 0;color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.scorerow{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:18px 0}
.score{display:flex;align-items:baseline;gap:4px;color:var(--band)}
.score b{font:800 64px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score span{color:var(--muted);font:500 15px var(--body)}
.scoretext{flex:1 1 260px;min-width:0}
.scoretext p{margin:8px 0 0}
.subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.sub{min-width:0}
.subh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;font-weight:600}
.subh b{font:700 18px var(--display);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.sub small{display:block;color:var(--muted);margin-top:6px;font-size:12.5px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;margin-top:22px}
.cols>div{min-width:0}
.trend{width:100%;height:auto;display:block}
.trend text{font:500 10px var(--mono);fill:var(--muted)}
.trend .grid{stroke:var(--line);stroke-width:1}
.trend .area{fill:var(--accent);opacity:.12}
.trend .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.trend .pt{fill:var(--accent)}
.trend .gap{fill:var(--surface);stroke:var(--warn);stroke-width:2}
.trend .lab{fill:var(--ink);font-weight:600}
.dir{margin:8px 0 0;font-size:13.5px;color:var(--muted)}
.cat{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:14px}
.cat+.cat{margin-top:9px}
.cat .d{width:10px;height:10px;border-radius:50%}
.cat .n{font-variant-numeric:tabular-nums;font-weight:600}
.cat .bar{grid-column:2 / 4;height:5px}
.cat .bar i{background:var(--ink);opacity:.55}
.streets,.plist{margin:0;padding:0;list-style:none;font-size:14px}
.streets li,.plist li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.streets li span:first-child,.plist li .nm{overflow-wrap:anywhere;min-width:0}
.plist .dd{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:13px;text-align:right}
.plist a{color:var(--ink)}
.plist .empty{color:var(--muted)}
.badge{display:inline-block;font:600 10.5px var(--body);letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;color:var(--muted);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 0}
.stat{background:var(--surface-2);border-radius:10px;padding:12px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.stat b{display:block;font:800 24px/1.15 var(--display);font-variant-numeric:tabular-nums;margin-top:6px;overflow-wrap:anywhere}
.stat span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.notes{margin:18px 0 0;padding:0;list-style:none;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:5px}
.err p{margin:6px 0 0;color:var(--muted)}
.warnlist{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btnrow a{display:inline-block;padding:10px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);font:600 13.5px var(--body);background:var(--surface)}

/* map */
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 12px 6px 6px;font:600 13px var(--body);cursor:pointer;max-width:100%}
.tabs button span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.tabs button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#map{height:400px;border-radius:12px;overflow:hidden;background:var(--surface-2);z-index:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.pin{display:grid;place-items:center;width:28px;height:28px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin b{transform:rotate(45deg);font:700 13px var(--display)}

/* links + footer */
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.links a{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--surface)}
.links a b{display:block;font-weight:600}
.links a span{color:var(--muted);font-size:13px}
details{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px}
summary{cursor:pointer;font-weight:600}
details p,details li{color:var(--muted);font-size:14px}
details ul{padding-left:18px;margin:8px 0}
footer{margin-top:28px;color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;gap:8px}
@media (max-width:480px){.score b{font-size:54px}.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.st .track i{transition:width .25s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M3.5 11.5 12 4l8.5 7.5V20h-17z"/><path d="M9.5 20v-5.5h5V20"/></svg></div>
      <div><b>Nest UK</b><small data-i18n="brandSub"></small></div>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-en" aria-pressed="true">EN</button>
      <button type="button" id="lang-zh" aria-pressed="false">中文</button>
    </div>
  </header>

  <main class="stack">
    <section>
      <h1 data-i18n="heroH"></h1>
      <p class="lede" data-i18n="heroP"></p>

      <form class="card" id="form" autocomplete="off">
        <label class="cap" for="q0" data-i18n="addrLabel"></label>
        <div style="margin-top:10px">
          <div class="addr"><span class="chip a">A</span><input type="text" id="q0" inputmode="text" data-i18n-ph="ph"></div>
          <div class="addr" id="row1" hidden><span class="chip b">B</span><input type="text" id="q1" data-i18n-ph="ph"></div>
          <div class="addr" id="row2" hidden><span class="chip c">C</span><input type="text" id="q2" data-i18n-ph="ph"></div>
        </div>
        <button type="button" class="linkbtn" id="addMore" data-i18n="addMore"></button>

        <div class="opts">
          <div class="opt">
            <span class="cap" data-i18n="radiusLabel"></span>
            <div class="seg" role="radiogroup">
              <label><input type="radio" name="radius" value="300"><span data-i18n="r300"></span></label>
              <label><input type="radio" name="radius" value="600" checked><span data-i18n="r600"></span></label>
              <label><input type="radio" name="radius" value="1609"><span data-i18n="r1609"></span></label>
            </div>
          </div>
          <div class="opt">
            <label class="cap" for="profile" data-i18n="profileLabel"></label>
            <select id="profile">
              <option value="balanced" data-i18n="p_balanced"></option>
              <option value="driver" data-i18n="p_driver"></option>
              <option value="family" data-i18n="p_family"></option>
              <option value="walker" data-i18n="p_walker"></option>
            </select>
          </div>
        </div>

        <div class="row">
          <button class="btn" type="submit" id="go" data-i18n="go"></button>
          <div class="ex"><span data-i18n="tryEx"></span><button type="button" id="ex1">GU1 2TN vs GU15 3SZ</button></div>
        </div>
        <p class="msg" id="msg" role="alert" hidden></p>
      </form>
    </section>

    <section class="card" id="status" hidden aria-live="polite"></section>

    <section class="card" id="intro">
      <div class="get">
        <div><b data-i18n="g_safety"></b><span data-i18n="g_safety_d"></span></div>
        <div><b data-i18n="g_flood"></b><span data-i18n="g_flood_d"></span></div>
        <div><b data-i18n="g_schools"></b><span data-i18n="g_schools_d"></span></div>
        <div><b data-i18n="g_life"></b><span data-i18n="g_life_d"></span></div>
        <div><b data-i18n="g_roads"></b><span data-i18n="g_roads_d"></span></div>
      </div>
    </section>

    <div class="topics" id="topics" role="tablist" hidden></div>
    <div class="stack" id="results"></div>

    <section class="card" id="mapcard" hidden>
      <h3 class="sec" data-i18n="mapTitle"></h3>
      <div class="tabs" id="maptabs"></div>
      <div id="map" role="img" aria-label="Map"></div>
      <div class="legend" id="legend"></div>
    </section>

    <section id="more" hidden class="stack">
      <div>
        <h3 class="sec" data-i18n="alsoTitle"></h3>
        <div class="links">
          <a href="https://check-long-term-flood-risk.service.gov.uk/" target="_blank" rel="noopener"><b data-i18n="l_flood"></b><span data-i18n="l_flood_d"></span></a>
          <a href="https://reports.ofsted.gov.uk/" target="_blank" rel="noopener"><b data-i18n="l_school"></b><span data-i18n="l_school_d"></span></a>
          <a href="https://checker.ofcom.org.uk/" target="_blank" rel="noopener"><b data-i18n="l_bb"></b><span data-i18n="l_bb_d"></span></a>
          <a href="https://www.tax.service.gov.uk/check-council-tax-band/search" target="_blank" rel="noopener"><b data-i18n="l_ct"></b><span data-i18n="l_ct_d"></span></a>
        </div>
      </div>
      <details>
        <summary data-i18n="howTitle"></summary>
        <div id="how"></div>
      </details>
    </section>
  </main>

  <footer>
    <span data-i18n="disclaimer"></span>
    <span data-i18n="attrib"></span>
    <span>© 2026 Billion Studio · <a href="mailto:info@billionstudio.app">info@billionstudio.app</a> · <a href="https://billionstudio.co.uk" target="_blank" rel="noopener">billionstudio.co.uk</a></span>
  </footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/*CORE:START*/
const CATS = {
  'burglary':               {en:'Burglary',                 zh:'入屋爆竊',     group:'home'},
  'vehicle-crime':          {en:'Vehicle crime',            zh:'車輛罪案',     group:'vehicle'},
  'violent-crime':          {en:'Violence & sexual offences', zh:'暴力及性罪行', group:'person'},
  'robbery':                {en:'Robbery',                  zh:'搶劫',         group:'person'},
  'theft-from-the-person':  {en:'Theft from the person',    zh:'扒竊',         group:'person'},
  'possession-of-weapons':  {en:'Weapons possession',       zh:'藏有武器',     group:'person'},
  'anti-social-behaviour':  {en:'Anti-social behaviour',    zh:'反社會行為',   group:'nuisance'},
  'public-order':           {en:'Public order',             zh:'擾亂公共秩序', group:'nuisance'},
  'criminal-damage-arson':  {en:'Criminal damage & arson',  zh:'刑事毀壞及縱火', group:'nuisance'},
  'drugs':                  {en:'Drugs',                    zh:'毒品',         group:'nuisance'},
  'bicycle-theft':          {en:'Bicycle theft',            zh:'單車盜竊',     group:'other'},
  'shoplifting':            {en:'Shoplifting',              zh:'店鋪盜竊',     group:'other'},
  'other-theft':            {en:'Other theft',              zh:'其他盜竊',     group:'other'},
  'other-crime':            {en:'Other crime',              zh:'其他罪案',     group:'other'}
};
/* lo/hi: reported crimes per km2 per year that map to 0 and 100 on a log scale */
const GROUPS = {
  home:     {en:'Break-ins',         zh:'入屋爆竊',   lo:2,  hi:90,   unitEn:'burglaries',        unitZh:'宗爆竊'},
  vehicle:  {en:'Vehicles',          zh:'車輛',       lo:2,  hi:90,   unitEn:'vehicle crimes',    unitZh:'宗車輛罪案'},
  person:   {en:'Personal safety',   zh:'人身安全',   lo:8,  hi:370,  unitEn:'offences',          unitZh:'宗罪案'},
  nuisance: {en:'Nuisance & damage', zh:'滋擾及破壞', lo:9,  hi:420,  unitEn:'incidents',         unitZh:'宗事件'}
};
const GROUP_ORDER = ['home','vehicle','person','nuisance'];
const PROFILES = {
  balanced: {home:.30, vehicle:.20, person:.30, nuisance:.20},
  driver:   {home:.30, vehicle:.35, person:.20, nuisance:.15},
  family:   {home:.30, vehicle:.15, person:.30, nuisance:.25},
  walker:   {home:.20, vehicle:.10, person:.45, nuisance:.25}
};
const CAP_R = 600;      /* radius used when police.uk refuses a query for returning too many crimes */
const MAX_R = 1609;     /* police.uk street-level queries cover about one mile */
const MI = 1609.34;

function scoreFromDensity(d, lo, hi){
  if (!(d > 0)) return 0;
  const s = (Math.log10(d) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)) * 100;
  return Math.max(0, Math.min(100, s));
}
function band(s){ return s < 20 ? 0 : s < 40 ? 1 : s < 60 ? 2 : s < 80 ? 3 : 4; }
function haversine(la1, ln1, la2, ln2){
  const R = 6371000, r = Math.PI / 180;
  const dLa = (la2 - la1) * r, dLn = (ln2 - ln1) * r;
  const a = Math.sin(dLa/2)**2 + Math.cos(la1*r) * Math.cos(la2*r) * Math.sin(dLn/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function squarePoly(lat, lng, r){
  const dLat = r / 111320, dLng = r / (111320 * Math.cos(lat * Math.PI / 180));
  const f = n => n.toFixed(6);
  return [[lat+dLat,lng-dLng],[lat+dLat,lng+dLng],[lat-dLat,lng+dLng],[lat-dLat,lng-dLng]].map(p => f(p[0]) + ',' + f(p[1])).join(':');
}
function monthList(latest, n){
  let [y, m] = latest.split('-').map(Number);
  const out = [];
  for (let i = 0; i < n; i++){
    out.unshift(y + '-' + String(m).padStart(2, '0'));
    m--; if (m === 0){ m = 12; y--; }
  }
  return out;
}
function median(a){
  const s = a.slice().sort((x, y) => x - y), h = s.length >> 1;
  return s.length ? (s.length % 2 ? s[h] : (s[h-1] + s[h]) / 2) : 0;
}

/* item: {geo:{lat,lng}, months:[chronological], raw:{month: [{c,la,ln,s}] | null}, capped:boolean} */
function analyse(item, radius, profile){
  const R = Math.min(radius, item.capped ? CAP_R : MAX_R);
  const md = item.months.map(m => {
    const arr = item.raw[m];
    if (!arr) return {m, n:null, list:[], gap:false};
    const list = arr.filter(x => haversine(item.geo.lat, item.geo.lng, x.la, x.ln) <= R);
    return {m, n:list.length, list, gap:false};
  });
  const have = md.filter(d => d.n !== null);
  const med = median(have.map(d => d.n));
  have.forEach(d => { if (med >= 30 && d.n < 0.25 * med) d.gap = true; });
  const eff = md.filter(d => d.n !== null && !d.gap);
  if (!eff.length) return null;
  const scale = 12 / eff.length;
  const area = Math.PI * Math.pow(R / 1000, 2);

  const catSum = {};
  Object.keys(CATS).forEach(k => catSum[k] = 0);
  const streetSum = {};
  eff.forEach(d => d.list.forEach(x => {
    if (catSum[x.c] === undefined) catSum[x.c] = 0;
    catSum[x.c]++;
    const s = (x.s || '').replace(/^On or near\s+/i, '').trim();
    if (s && !/^no location$/i.test(s)) streetSum[s] = (streetSum[s] || 0) + 1;
  }));
  const cats = Object.keys(catSum).map(k => ({key:k, n:Math.round(catSum[k] * scale), raw:catSum[k], group:(CATS[k] || {group:'other'}).group}))
    .filter(c => c.n > 0).sort((a, b) => b.n - a.n);
  const total = cats.reduce((s, c) => s + c.n, 0);

  const w = PROFILES[profile] || PROFILES.balanced;
  const groups = {};
  let overall = 0;
  GROUP_ORDER.forEach(g => {
    const count = Object.keys(catSum).filter(k => (CATS[k] || {}).group === g).reduce((s, k) => s + catSum[k], 0) * scale;
    const density = count / area;
    const score = Math.round(scoreFromDensity(density, GROUPS[g].lo, GROUPS[g].hi));
    groups[g] = {count:Math.round(count), density, score};
    overall += w[g] * scoreFromDensity(density, GROUPS[g].lo, GROUPS[g].hi);
  });
  overall = Math.round(overall);

  const monthly = md.map(d => ({m:d.m, n:d.n, gap:d.gap}));
  let trend = null;
  if (eff.length >= 6){
    const h = Math.floor(eff.length / 2);
    const earlier = eff.slice(0, h).reduce((s, d) => s + d.n, 0) / h;
    const recent = eff.slice(-h).reduce((s, d) => s + d.n, 0) / h;
    trend = {earlier, recent, change: earlier >= 5 ? (recent - earlier) / earlier : null};
  }
  const streets = Object.keys(streetSum).map(k => ({name:k, n:streetSum[k]})).sort((a, b) => b.n - a.n).slice(0, 5);

  return {
    R, area, overall, band:band(overall), groups, cats, total, monthly, trend, streets,
    effMonths:eff.length, gapMonths:md.filter(d => d.gap).map(d => d.m),
    failedMonths:md.filter(d => d.n === null).length,
    dots:md.filter(d => d.n !== null && !d.gap).flatMap(d => d.list)
  };
}

/* ---------- flood ---------- */
const FLOOD_RANK = {'very low':0, 'low':1, 'medium':2, 'high':3};
/* ArcGIS query result -> worst band at or near the point, or null when no zone is mapped there */
function parseFloodBand(j){
  if (!j || j.error) throw new Error('flood');
  let best = null;
  (j.features || []).forEach(f => {
    const v = String((f.attributes || {}).prob_4band || '').toLowerCase();
    if (v in FLOOD_RANK && (best === null || FLOOD_RANK[v] > FLOOD_RANK[best])) best = v;
  });
  return best;
}
function parseFloodWarnings(j){
  const items = (j && j.items) || [];
  return items.filter(x => x.severityLevel >= 1 && x.severityLevel <= 3)
    .map(x => ({level:x.severityLevel, severity:x.severity || '', name:x.description || ''}))
    .sort((a, b) => a.level - b.level);
}
function floodUrls(lat, lng){
  return {
    band:'https://gisrest.defra.gov.uk/server/rest/services/EA/RiskOfFloodingFromRiversAndSea/MapServer/0/query?f=json&geometry=' + lng + ',' + lat +
      '&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects&distance=25&units=esriSRUnit_Meter&outFields=prob_4band&returnGeometry=false',
    warn:'https://environment.data.gov.uk/flood-monitoring/id/floods?lat=' + lat + '&long=' + lng + '&dist=3'
  };
}

/* ---------- places (OpenStreetMap via Overpass) ---------- */
const ASIAN_RE = /oriental|asian|chinese|wing yip|hoo hing|wai yee hong|see woo|loon fung|hong kong/i;
const CUISINE_RE = /chinese|cantonese|dim_sum|hong_kong|asian|taiwanese|sichuan|szechuan/i;
function placesQuery(lat, lng){
  const p = lat + ',' + lng;
  return '[out:json][timeout:40];\n' +
    'way["highway"]["name"~"^High (Street|St)$",i](around:1500,' + p + ')->.hs;\n(\n' +
    '  nwr["amenity"="school"](around:4800,' + p + ');\n' +
    '  nwr["amenity"="kindergarten"](around:2400,' + p + ');\n' +
    '  nwr["shop"="mall"](around:5000,' + p + ');\n' +
    '  nwr["shop"="supermarket"](around:1600,' + p + ');\n' +
    '  nwr["shop"~"^(supermarket|convenience|greengrocer|butcher|general|food|deli)$"]["name"~"oriental|asian|chinese|wing yip|hoo hing|wai yee hong|see woo|loon fung|hong kong",i](around:4000,' + p + ');\n' +
    '  nwr["amenity"~"^(restaurant|cafe|pub|fast_food)$"](around:800,' + p + ');\n' +
    '  nwr["amenity"~"^(restaurant|fast_food)$"]["cuisine"~"chinese|cantonese|dim_sum|hong_kong|asian|taiwanese|sichuan|szechuan",i](around:3000,' + p + ');\n' +
    '  nwr["leisure"~"^(sports_centre|fitness_centre)$"](around:3000,' + p + ');\n' +
    '  nwr["leisure"="swimming_pool"]["access"~"^(yes|public)$"](around:3000,' + p + ');\n' +
    '  nwr["railway"="station"](around:5000,' + p + ');\n' +
    ')->.pois;\n.pois out center tags;\n.hs out geom;\n' +
    'nwr["shop"](around:500,' + p + ');\nout count;';
}
function roadsQuery(lat, lng){
  return '[out:json][timeout:40];\nway["highway"~"^(motorway|trunk)$"](around:3000,' + lat + ',' + lng + ');\nout geom;';
}
function minDistToLine(pts, geo){
  const kx = 111320 * Math.cos(geo.lat * Math.PI / 180), ky = 110574;
  const P = pts.map(p => [(p.lon - geo.lng) * kx, (p.lat - geo.lat) * ky]);
  let best = Infinity;
  for (let i = 0; i < P.length; i++){
    if (i === 0){ best = Math.min(best, Math.hypot(P[0][0], P[0][1])); continue; }
    const x1 = P[i-1][0], y1 = P[i-1][1], dx = P[i][0] - x1, dy = P[i][1] - y1, l2 = dx*dx + dy*dy;
    const tt = l2 ? Math.max(0, Math.min(1, -(x1*dx + y1*dy) / l2)) : 0;
    best = Math.min(best, Math.hypot(x1 + tt*dx, y1 + tt*dy));
  }
  return best;
}
function classifySchool(t){
  const name = t.name || '';
  const isced = String(t['isced:level'] || '');
  const P = /primary|infant|junior|first school|village school/i;
  const S = /secondary|high school|grammar|upper school|sixth form|senior school|college|comprehensive/i;
  let phase = 'unknown';
  if (t.amenity === 'kindergarten' || /nursery|pre-?school|early years|kindergarten|playgroup/i.test(name)) phase = 'nursery';
  else if (/\bspecial\b|\bSEN\b|pupil referral|nurture/i.test(name)) phase = 'special';
  else if (isced){
    const has1 = /1/.test(isced), has23 = /[23]/.test(isced);
    phase = has1 && has23 ? 'allthrough' : has1 ? 'primary' : has23 ? 'secondary' : 'unknown';
  }
  else if (P.test(name) && S.test(name)) phase = 'allthrough';
  else if (P.test(name)) phase = 'primary';
  else if (S.test(name)) phase = 'secondary';
  const indep = t['operator:type'] === 'private' || t.fee === 'yes' || /independent|prep school|preparatory/i.test(name);
  const faith = !!t.religion && t.religion !== 'none';
  return {phase, indep, faith};
}
function dedupe(list){
  const out = [];
  list.slice().sort((a, b) => a.d - b.d).forEach(x => {
    const k = (x.name || '').toLowerCase();
    if (k && out.some(o => (o.name || '').toLowerCase() === k && Math.abs(o.d - x.d) < 120)) return;
    out.push(x);
  });
  return out;
}
function summarisePlaces(elements, geo){
  const out = {schools:[], supers:[], malls:[], food:[], sports:[], stations:[], highStreet:null, shopCount500:null};
  const seen = new Set();
  elements.forEach(el => {
    if (el.type === 'count'){ out.shopCount500 = Number(el.tags && el.tags.total); return; }
    const key = el.type + el.id;
    if (seen.has(key)) return;
    seen.add(key);
    const t = el.tags || {};
    if (el.geometry && el.type === 'way' && t.highway){
      const d = minDistToLine(el.geometry, geo);
      if (!out.highStreet || d < out.highStreet.d) out.highStreet = {name:t.name || 'High Street', d};
      return;
    }
    const c = el.center || (el.lat !== undefined ? {lat:el.lat, lon:el.lon} : null);
    if (!c) return;
    const d = haversine(geo.lat, geo.lng, c.lat, c.lon);
    const base = {name:t.name || '', d, la:c.lat, ln:c.lon};
    if (t.amenity === 'school' || t.amenity === 'kindergarten'){
      out.schools.push(Object.assign(base, classifySchool(t)));
    } else if (t.shop === 'mall'){
      out.malls.push(base);
    } else if (t.shop){
      const asian = ASIAN_RE.test(t.name || '');
      if (t.shop === 'supermarket' || asian) out.supers.push(Object.assign(base, {asian}));
    } else if (/^(restaurant|cafe|pub|fast_food)$/.test(t.amenity || '')){
      out.food.push(Object.assign(base, {type:t.amenity, chinese:CUISINE_RE.test(t.cuisine || '')}));
    } else if (t.leisure && /^(sports_centre|fitness_centre|swimming_pool)$/.test(t.leisure)){
      out.sports.push(Object.assign(base, {type:t.leisure}));
    } else if (t.railway === 'station'){
      out.stations.push(base);
    }
  });
  ['schools','supers','malls','food','sports','stations'].forEach(k => { out[k] = dedupe(out[k]); });
  return out;
}
function placeDigest(P){
  const byD = (a, b) => a.d - b.d;
  const stateSchools = P.schools.filter(s => !s.indep);
  const prim = stateSchools.filter(s => s.phase === 'primary' || s.phase === 'allthrough').sort(byD);
  const sec = stateSchools.filter(s => s.phase === 'secondary' || s.phase === 'allthrough').sort(byD);
  const nurs = P.schools.filter(s => s.phase === 'nursery').sort(byD);
  const indep = P.schools.filter(s => s.indep && s.phase !== 'nursery').sort(byD);
  const other = stateSchools.filter(s => s.phase === 'unknown').sort(byD);
  const food800 = P.food.filter(f => f.d <= 800);
  const cnt = ty => food800.filter(f => f.type === ty).length;
  const food500 = P.food.filter(f => f.d <= 500).length;
  const activity = (P.shopCount500 || 0) + food500;
  const asianFood = P.food.filter(f => f.chinese).sort(byD);
  const asianShops = P.supers.filter(s => s.asian).sort(byD);
  return {
    prim, sec, nurs, indep, other,
    prim1:prim.filter(s => s.d <= MI).length, sec3:sec.filter(s => s.d <= 3 * MI).length,
    supers:P.supers.slice().sort(byD), malls:P.malls.slice().sort(byD),
    sports:P.sports.slice().sort(byD), stations:P.stations.slice().sort(byD),
    food:{n:food800.length, restaurant:cnt('restaurant'), cafe:cnt('cafe'), pub:cnt('pub'), fast_food:cnt('fast_food')}, foodList:food800,
    asianFood, asianShops, highStreet:P.highStreet, shops500:P.shopCount500, food500, activity,
    activityBand:activity < 8 ? 0 : activity < 40 ? 1 : 2
  };
}
function summariseRoads(elements, geo){
  const res = {motorway:null, trunk:null, lines:[]};
  let points = 0;
  elements.forEach(el => {
    if (el.type !== 'way' || !el.geometry) return;
    const t = el.tags || {};
    const kind = t.highway === 'motorway' ? 'motorway' : t.highway === 'trunk' ? 'trunk' : null;
    if (!kind) return;
    const d = minDistToLine(el.geometry, geo);
    if (!res[kind] || d < res[kind].d) res[kind] = {d, ref:t.ref || t.name || ''};
    points += el.geometry.length;
    res.lines.push({kind, pts:el.geometry.map(p => [p.lat, p.lon])});
  });
  if (points > 6000){
    const step = Math.ceil(points / 6000);
    res.lines.forEach(l => { l.pts = l.pts.filter((p, i) => i % step === 0 || i === l.pts.length - 1); });
  }
  return res;
}
function roadBand(d){ return d == null ? 3 : d < 300 ? 0 : d < 800 ? 1 : d < 1500 ? 2 : 3; }

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const state = {lang:'en', radius:600, profile:'balanced', topic:'overview', items:[], mapIdx:0, running:false, latest:null, digests:[]};
const LETTERS = ['A','B','C'], IDCLS = ['a','b','c'];
const BAND_VAR = ['--good','--ok','--warn','--bad','--severe'];
const GROUP_COLOR = {home:'#d6336c', vehicle:'#f08c00', person:'#7048e8', nuisance:'#1098ad', other:'#868e96'};

function t(key, vars){
  let s = (T[state.lang] && T[state.lang][key]) || T.en[key] || key;
  if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}

  catch(e){ return m; }
}

function fmtDist(m){ return m == null ? '–' : m < 500 ? Math.round(m / 10) * 10 + ' m' : (m / MI).toFixed(1) + ' mi'; }
function walkMin(m){ return Math.max(1, Math.round(m * 1.3 / 80)); }

/* ---------- network ---------- */
async function getJSON(url, tries = 3){
  for (let i = 0; i < tries; i++){
    const r = await fetch(url);
    if (r.status === 429){ await sleep(1200 * (i + 1)); continue; }
    return r;
  }
  throw new Error('rate');
}
async function pool(tasks, n){
  let i = 0;
  await Promise.all(Array.from({length:n}, async () => {
    while (i < tasks.length){ const k = i++; await tasks[k](); }
  }));
}
async function getLatestMonth(){
  if (state.latest) return state.latest;
  try{
    const r = await fetch('https://data.police.uk/api/crime-last-updated');
    if (r.ok){ const j = await r.json(); state.latest = String(j.date).slice(0, 7); return state.latest; }
  }catch(e){}
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 2);
  state.latest = d.toISOString().slice(0, 7);
  return state.latest;
}
async function geocode(q){
  const raw = q.trim().toUpperCase().replace(/\s+/g, ' ');
  const isPostcode = /^[A-Z]{1,2}\d[A-Z\d]?\s?\d[A-Z]{2}$/.test(raw);
  const isOutcode = /^[A-Z]{1,2}\d[A-Z\d]?$/.test(raw);
  if (isPostcode || isOutcode){
    let r;
    try{ r = await fetch('https://api.postcodes.io/' + (isPostcode ? 'postcodes/' : 'outcodes/') + encodeURIComponent(raw)); }
    catch(e){ throw new Error('geo'); }
    if (r.status === 404) throw new Error('notfound');
    if (!r.ok) throw new Error('geo');
    const j = (await r.json()).result;
    const countries = Array.isArray(j.country) ? j.country : [j.country];
    if (countries.length && countries.every(c => c === 'Scotland')) throw new Error('scot');
    const place = isPostcode ? (j.admin_district || j.region || '') : ((j.admin_district || []).join(', '));
    return {lat:j.latitude, lng:j.longitude, label:isPostcode ? j.postcode : raw, place, country:countries.length === 1 ? (countries[0] || '') : ''};
  }
  let r;
  try{
    r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=1&countrycodes=gb&q=' + encodeURIComponent(q));
  }catch(e){ throw new Error('geo'); }
  if (!r.ok) throw new Error('geo');
  const j = await r.json();
  await sleep(1100);
  if (!j.length) throw new Error('notfound');
  const a = j[0].address || {};
  if (a.state === 'Scotland') throw new Error('scot');
  const parts = String(j[0].display_name).split(',').map(s => s.trim());
  return {lat:+j[0].lat, lng:+j[0].lon, label:parts.slice(0, 2).join(', '), place:[a.town || a.city || a.village || a.suburb || '', a.state || ''].filter(Boolean).join(', '), country:a.state || ''};
}

/* crime */
async function fetchMonth(geo, month, capped){
  const base = 'https://data.police.uk/api/crimes-street/all-crime';
  const q = capped ? 'poly=' + squarePoly(geo.lat, geo.lng, CAP_R) : 'lat=' + geo.lat + '&lng=' + geo.lng;
  const r = await getJSON(base + '?' + q + '&date=' + month);
  if (r.status === 503 && !capped) return {over:true};
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  return {list:j.map(x => ({c:x.category, la:+x.location.latitude, ln:+x.location.longitude, s:(x.location.street && x.location.street.name) || ''}))};
}
async function loadCrimes(item){
  const months = item.months;
  item.crime = {raw:{}, months, done:0, total:months.length, failed:0, capped:false};
  const C = item.crime;
  async function one(m){
    try{
      let r = await fetchMonth(item.geo, m, C.capped);
      if (r.over){ C.capped = true; r = await fetchMonth(item.geo, m, true); }
      C.raw[m] = r.list;
    }catch(e){ C.raw[m] = null; C.failed++; }
    C.done++; renderStatus();
  }
  await one(months[months.length - 1]);
  await pool(months.slice(0, -1).map(m => () => one(m)), 4);
  if (C.failed >= months.length) throw new Error('crime');
}

/* flood */
async function loadFlood(item){
  const c = item.geo.country;
  if (c && c !== 'England'){ item.flood = {}; item.mod.flood = 'na'; return; }
  const u = floodUrls(item.geo.lat, item.geo.lng);
  const F = {band:null, bandOk:false, warnings:[], warnOk:false};
  await Promise.all([
    (async () => { try{ const r = await fetch(u.band); if (r.ok){ F.band = parseFloodBand(await r.json()); F.bandOk = true; } }catch(e){} })(),
    (async () => { try{ const r = await fetch(u.warn); if (r.ok){ F.warnings = parseFloodWarnings(await r.json()); F.warnOk = true; } }catch(e){} })()
  ]);
  item.flood = F;
  if (!F.bandOk && !F.warnOk) throw new Error('flood');
}

let ovChain = Promise.resolve();
function ovRun(fn){
  const p = ovChain.then(() => fn());
  ovChain = p.then(() => sleep(400), () => sleep(400));
  return p;
}
async function overpass(q){
  let lastErr = null;
  for (let attempt = 0; attempt < 4; attempt++){
    try{
      const r = await fetch(OVERPASS[attempt % OVERPASS.length], {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'data=' + encodeURIComponent(q)});
      if ([429, 502, 503, 504].indexOf(r.status) >= 0){ lastErr = new Error('busy'); await sleep(1500 * (attempt + 1)); continue; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if (j.remark && /timed out|out of memory/i.test(j.remark) && !(j.elements && j.elements.length)){ lastErr = new Error('remark'); continue; }
      return j.elements || [];
    }catch(e){ lastErr = e; await sleep(800); }
  }
  throw lastErr || new Error('overpass');
}
async function loadPlaces(item){
  const els = await ovRun(() => overpass(placesQuery(item.geo.lat, item.geo.lng)));
  item.places = {data:summarisePlaces(els, item.geo)};
}
async function loadRoads(item){
  const els = await ovRun(() => overpass(roadsQuery(item.geo.lat, item.geo.lng)));
  item.roads = {data:summariseRoads(els, item.geo)};
}
async function runModule(it, mod){
  it.mod[mod] = 'run'; renderStatus();
  try{
    if (mod === 'crime') await loadCrimes(it);
    else if (mod === 'flood') await loadFlood(it);
    else if (mod === 'places') await loadPlaces(it);
    else if (mod === 'roads') await loadRoads(it);
    if (it.mod[mod] === 'run') it.mod[mod] = 'ok';
  }catch(e){ it.mod[mod] = 'err'; }
  renderStatus();
}

/* ---------- run ---------- */
async function run(){
  if (state.running) return;
  const qs = [0, 1, 2].map(i => $('#q' + i).value.trim()).filter(Boolean);
  if (!qs.length){ setMsg(t('needAddr')); return; }
  setMsg('');
  state.running = true; $('#go').disabled = true;
  state.items = qs.map((q, i) => ({q, i, status:'geocoding', mod:{}}));
  state.digests = [];
  $('#results').innerHTML = ''; $('#topics').hidden = true; $('#mapcard').hidden = true; $('#more').hidden = true; $('#intro').hidden = true;
  renderStatus();
  const latest = await getLatestMonth();
  const months = monthList(latest, 12);
  for (const it of state.items){
    try{ it.geo = await geocode(it.q); it.status = 'ready'; it.months = months; MODS.forEach(m => it.mod[m] = 'run'); }
    catch(e){ it.status = 'error'; it.error = e.message === 'scot' ? t('errScot') : e.message === 'notfound' ? t('errNotFound') : t('errGeo'); }
    renderStatus();
  }
  await Promise.all(state.items.filter(i => i.status === 'ready').flatMap(it => MODS.map(m => runModule(it, m))));
  state.running = false; $('#go').disabled = false;
  const first = state.items.find(i => i.status === 'ready');
  state.mapIdx = first ? first.i : 0;
  state.topic = 'overview';
  $('#status').hidden = true;
  render();
}
async function retry(i, mod){
  const it = state.items[i]; if (!it || !it.geo) return;
  await runModule(it, mod);
  render();
}

function renderStatus(){
  const box = $('#status');
  box.hidden = !state.running;
  if (!state.running) return;
  box.innerHTML = state.items.map(it => {
    if (it.status === 'geocoding') return '<div class="st"><span class="chip ' + IDCLS[it.i] + '">' + LETTERS[it.i] + '</span><p>' + esc(t('finding')) + '</p></div>';
    if (it.status === 'error') return '<div class="st"><span class="chip ' + IDCLS[it.i] + '">' + LETTERS[it.i] + '</span><p><b>' + esc(it.q) + '</b> · ' + esc(it.error) + '</p></div>';
    const names = {crime:'st_crime', flood:'st_flood', places:'st_places', roads:'st_roads'};
    const mods = MODS.map(m => {
      const s = it.mod[m];
      let sym = s === 'ok' ? '✓' : s === 'err' ? '✕' : s === 'na' ? '–' : '…';
      if (m === 'crime' && s === 'run' && it.crime) sym = it.crime.done + '/' + it.crime.total;
      return '<span class="' + (s === 'ok' ? 'ok' : s === 'err' ? 'err' : '') + '">' + esc(t(names[m])) + ' ' + sym + '</span>';
    }).join('');
    const finished = MODS.filter(m => it.mod[m] !== 'run').length;
    return '<div class="st"><span class="chip ' + IDCLS[it.i] + '">' + LETTERS[it.i] + '</span><div><p><b>' + esc(it.geo.label) + '</b></p><div class="mods">' + mods + '</div><div class="track"><i style="width:' + Math.round(finished / MODS.length * 100) + '%"></i></div></div></div>';
  }).join('');
}

/* ---------- digests ---------- */
function digest(item){
  const d = {item, an:null, pl:null, flood:null, floodNA:item.mod.flood === 'na', roads:null};
  if (item.mod.crime === 'ok') d.an = analyse({geo:item.geo, months:item.crime.months, raw:item.crime.raw, capped:item.crime.capped}, state.radius, state.profile);
  if (item.mod.places === 'ok') d.pl = placeDigest(item.places.data);
  if (item.mod.flood === 'ok') d.flood = item.flood;
  if (item.mod.roads === 'ok') d.roads = item.roads.data;
  return d;
}
function floodRank(b){ return b === null ? -1 : FLOOD_RANK[b]; }
function floodIdx(b){ return b === null ? 0 : ({'very low':1, 'low':2, 'medium':3, 'high':4})[b]; }
function floodKey(b){ return b === null ? 'none' : b.replace(' ', ''); }
function floodPill(b){ return pill(t('fl_b_' + floodKey(b)), floodIdx(b)); }

/* ---------- sections ---------- */
function sparkline(an){
  const W = 300, H = 92, x0 = 14, x1 = W - 14, yTop = 18, yBase = 66;
  const pts = an.monthly;
  const vals = pts.filter(p => p.n !== null).map(p => p.n);
  const max = Math.max(1, ...vals);
  const X = i => x0 + (pts.length === 1 ? 0 : i * (x1 - x0) / (pts.length - 1));
  const Y = v => yBase - v / max * (yBase - yTop);
  const real = pts.map((p, i) => ({p, i})).filter(o => o.p.n !== null);
  const line = real.map((o, k) => (k ? 'L' : 'M') + X(o.i).toFixed(1) + ' ' + Y(o.p.n).toFixed(1)).join(' ');
  const area = real.length ? line + ' L' + X(real[real.length - 1].i).toFixed(1) + ' ' + yBase + ' L' + X(real[0].i).toFixed(1) + ' ' + yBase + ' Z' : '';
  const dots = real.map(o => '<circle class="' + (o.p.gap ? 'gap' : 'pt') + '" cx="' + X(o.i).toFixed(1) + '" cy="' + Y(o.p.n).toFixed(1) + '" r="' + (o.p.gap ? 3.5 : 2.4) + '"/>').join('');
  const peakIdx = real.reduce((b, o) => (o.p.n > (b ? b.p.n : -1) ? o : b), null);
  const last = real[real.length - 1];
  const labels = [];
  const lab = o => {
    const x = Math.max(16, Math.min(W - 16, X(o.i)));
    labels.push('<text class="lab" x="' + x.toFixed(1) + '" y="' + (Y(o.p.n) - 7).toFixed(1) + '" text-anchor="middle">' + o.p.n + '</text>');
  };
  if (peakIdx) lab(peakIdx);
  if (last && peakIdx && Math.abs(last.i - peakIdx.i) >= 2) lab(last);
  return '<svg class="trend" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t('trendTitle')) + '">' +
    '<line class="grid" x1="' + x0 + '" x2="' + x1 + '" y1="' + yBase + '" y2="' + yBase + '"/>' +
    '<line class="grid" x1="' + x0 + '" x2="' + x1 + '" y1="' + yTop + '" y2="' + yTop + '" stroke-dasharray="3 4"/>' +
    '<path class="area" d="' + area + '"/><path class="ln" d="' + line + '"/>' + dots + labels.join('') +
    '<text x="' + x0 + '" y="82" text-anchor="start">' + esc(fmtMonth(pts[0].m)) + '</text>' +
    '<text x="' + x1 + '" y="82" text-anchor="end">' + esc(fmtMonth(pts[pts.length - 1].m)) + '</text></svg>';
}
function trendText(an){
  const tr = an.trend;
  if (!tr || tr.change === null) return {txt:t('trendNA'), label:t('na')};
  const h = Math.floor(an.effMonths / 2);
  const vars = {h, recent:tr.recent.toFixed(1), earlier:tr.earlier.toFixed(1), pct:(tr.change > 0 ? '+' : '') + Math.round(tr.change * 100) + '%'};
  if (tr.change > 0.1) return {txt:t('trendUp', vars), label:t('up') + ' ' + vars.pct};
  if (tr.change < -0.1) return {txt:t('trendDown', vars), label:t('down') + ' ' + vars.pct};
  return {txt:t('trendFlat', vars), label:t('flat')};
}
function crimePill(an){ return pill(t('risk', {b:t('b' + an.band)}), an.band); }

  const headline = t('headline', {total:an.total.toLocaleString('en-GB'), r:radiusText(an.R), cat:top ? catName(top.key) : '-', pct:top ? Math.round(top.n / an.total * 100) : 0, grp:GROUPS[worst][state.lang], score:an.groups[worst].score});

    const s = an.groups[g];
    return '<div class="sub"><div class="subh"><span>' + esc(GROUPS[g][state.lang]) + '</span><b>' + s.score + '</b></div>' +
      '<div class="bar"><i style="width:' + s.score + '%;background:var(' + BAND_VAR[band(s.score)] + ')"></i></div>' +

  }).join('');
  const maxCat = an.cats.length ? an.cats[0].n : 1;
  const cats = an.cats.map(c => '<div class="cat"><span class="d" style="background:' + GROUP_COLOR[c.group] + '"></span><span>' + esc(catName(c.key)) + '</span><span class="n">' + c.n.toLocaleString('en-GB') + '</span><div class="bar"><i style="width:' + Math.max(2, Math.round(c.n / maxCat * 100)) + '%"></i></div></div>').join('');
  const streets = an.streets.length ? '<ul class="streets">' + an.streets.map(s => '<li><span>' + esc(s.name) + '</span><b>' + s.n + '</b></li>').join('') + '</ul><p class="dir">' + esc(t('streetNote')) + '</p>' : '';
  const notes = [];
  if (item.crime.capped) notes.push(t('noteCap'));
  if (an.gapMonths.length) notes.push(t('noteGap', {m:an.gapMonths.map(fmtMonth).join(', ')}));
  if (an.failedMonths) notes.push(t('noteFail', {n:an.failedMonths}));
  notes.push(t('noteFuzzy'), t('noteArea'));
  const tt = trendText(an);
  return '<article class="card">' + head(item, [item.geo.place, radiusText(an.R)].filter(Boolean).join(' · ')) +
    '<div class="scorerow"><div class="score" style="--band:var(' + BAND_VAR[an.band] + ')"><b>' + an.overall + '</b><span>/100</span></div><div class="scoretext">' + crimePill(an) + '<p>' + esc(headline) + '</p></div></div>' +
    '<div class="subs">' + subs + '</div>' +
    '<div class="cols"><div><h3 class="sec">' + esc(t('trendTitle')) + '</h3>' + sparkline(an) + '<p class="dir">' + esc(tt.txt) + '</p></div>' +
    '<div><h3 class="sec">' + esc(t('catTitle')) + '</h3>' + cats + '</div></div>' +
    (streets ? '<div style="margin-top:22px"><h3 class="sec">' + esc(t('streetTitle')) + '</h3>' + streets + '</div>' : '') +
    '<ul class="notes">' + notes.map(n => '<li>' + esc(n) + '</li>').join('') + '</ul></article>';
}

  if (d.floodNA){
    return '<article class="card">' + head(item, item.geo.place) + '<p>' + esc(t('fl_na')) + '</p><div class="btnrow"><a href="https://check-long-term-flood-risk.service.gov.uk/" target="_blank" rel="noopener">' + esc(t('fl_btn')) + '</a></div></article>';
  }
  const F = d.flood;
  if (!F) return unavailableCard(item, 'flood', item.geo.place);
  let bandBlock = '';
  if (F.bandOk){
    bandBlock = '<div class="stats"><div class="stat"><small>' + esc(t('fl_band_label')) + '</small><b>' + floodPill(F.band) + '</b><span>' + esc(t('fl_c_' + floodKey(F.band))) + '</span></div>' +
      stat(t('fl_warn_label'), F.warnOk ? String(F.warnings.length) : '–', '') + '</div>';
  } else {
    bandBlock = '<p class="dir">' + esc(t('unavailable')) + ' (' + esc(t('fl_band_label')) + ') <button type="button" class="linkbtn" data-retry="' + item.i + ':flood">' + esc(t('retry')) + '</button></p>';
  }
  let warn = '';
  if (F.warnOk){
    warn = F.warnings.length
      ? '<p style="margin:16px 0 0">' + esc(t('fl_warnSome', {n:F.warnings.length})) + '</p><ul class="warnlist">' + F.warnings.map(w => '<li>' + pill(t('fl_sev' + w.level), w.level === 1 ? 4 : w.level === 2 ? 3 : 2) + ' ' + esc(w.name) + '</li>').join('') + '</ul>'
      : '<p style="margin:16px 0 0">' + esc(t('fl_warnNone')) + '</p>';
  }
  return '<article class="card">' + head(item, item.geo.place) + bandBlock + warn +
    '<ul class="notes"><li>' + esc(t('fl_gap')) + '</li><li>' + esc(t('fl_src')) + '</li></ul>' +
    '<div class="btnrow"><a href="https://check-long-term-flood-risk.service.gov.uk/" target="_blank" rel="noopener">' + esc(t('fl_btn')) + '</a></div></article>';
}

      {l:t('lf_food'), f:d => d.pl ? num(d.pl.food.n, String(d.pl.food.n)) : null},
      {l:t('lf_chinese'), f:d => d.pl ? (d.pl.asianFood[0] ? dist(d.pl.asianFood[0].d) : num(null, '–')) : null},
      {l:t('lf_sport'), f:d => d.pl ? (d.pl.sports[0] ? dist(d.pl.sports[0].d) : num(null, '–')) : null},
      {l:t('lf_station'), f:d => d.pl ? (d.pl.stations[0] ? dist(d.pl.stations[0].d) : num(null, '–')) : null}
    ]},
    {g:'tab_roads', rows:[
      {l:t('rd_motor'), best:'high', f:d => d.roads ? (d.roads.motorway ? dist(d.roads.motorway.d) : num(1e9, esc(t('rd_none')))) : null},
      {l:t('rd_trunk'), best:'high', f:d => d.roads ? (d.roads.trunk ? dist(d.roads.trunk.d) : num(1e9, esc(t('rd_none')))) : null}
    ]}
  ];
  const headCells = ds.map(d => '<th><span class="chip ' + IDCLS[d.item.i] + '">' + LETTERS[d.item.i] + '</span><div style="margin-top:6px;color:var(--ink);font-weight:600;overflow-wrap:anywhere">' + esc(d.item.geo.label) + '</div></th>').join('');
  const body = groups.map(grp => {
    const rows = grp.rows.map(r => {
      const vals = ds.map(d => r.f(d));
      const nums = vals.map(v => v && v.k !== null && v.k !== undefined ? v.k : null);
      const have = nums.filter(n => n !== null);
      let bestV = null;
      if (r.best && have.length > 1){
        const lo = Math.min.apply(null, have), hi = Math.max.apply(null, have);
        if (lo !== hi) bestV = r.best === 'low' ? lo : hi;
      }
      return '<tr><th scope="row">' + esc(r.l) + '</th>' + vals.map((v, k) => {
        const isBest = bestV !== null && nums[k] === bestV;
        return '<td class="v' + (isBest ? ' best' : '') + '">' + (v ? v.html : '–') + (isBest ? '<small>' + esc(t('best')) + '</small>' : '') + '</td>';
      }).join('') + '</tr>';
    }).join('');
    return '<tr class="grp"><th colspan="' + (ds.length + 1) + '">' + esc(t(grp.g)) + '</th></tr>' + rows;
  }).join('');
  return '<section class="card"><h3 class="sec">' + esc(t('cmpTitle')) + '</h3><div class="tablewrap"><table><thead><tr><th>' + esc(t('metric')) + '</th>' + headCells + '</tr></thead><tbody>' + body + '</tbody></table></div></section>';
}

/* ---------- render ---------- */
function render(){
  const ds = state.items.filter(i => i.status === 'ready').map(digest);
  state.digests = ds;
  const out = [];
  state.items.filter(i => i.status === 'error').forEach(it => {
    out.push('<article class="card err"><header class="rhead"><span class="chip ' + IDCLS[it.i] + '">' + LETTERS[it.i] + '</span><div><h2>' + esc(it.q) + '</h2></div></header><p>' + esc(it.error) + '</p></article>');
  });
  const has = ds.length > 0;
  $('#topics').hidden = !has;
  $('#topics').innerHTML = TOPICS.map(k => '<button type="button" role="tab" data-topic="' + k + '" aria-selected="' + (k === state.topic) + '">' + esc(t('tab_' + k)) + '</button>').join('');
  if (has){
    if (state.topic === 'overview') out.push(overviewHTML(ds));
    else {
      const fn = {safety:safetyHTML, flood:floodHTML, schools:schoolsHTML, life:lifeHTML, roads:roadsHTML}[state.topic];
      ds.forEach(d => out.push(fn(d)));
    }
  }
  $('#results').innerHTML = out.join('');
  $('#more').hidden = !has;
  $('#how').innerHTML = t('how', {rows:GROUP_ORDER.map(g => '<li>' + esc(t('howRow', {g:GROUPS[g][state.lang], lo:GROUPS[g].lo, hi:GROUPS[g].hi})) + '</li>').join('')});
  const showMap = has && ['safety', 'schools', 'life', 'roads'].indexOf(state.topic) >= 0;
  $('#mapcard').hidden = !showMap;
  if (showMap){
    if (!ds.some(d => d.item.i === state.mapIdx)) state.mapIdx = ds[0].item.i;
    $('#maptabs').innerHTML = ds.map(d => '<button type="button" data-i="' + d.item.i + '" aria-pressed="' + (d.item.i === state.mapIdx) + '"><span class="chip ' + IDCLS[d.item.i] + '">' + LETTERS[d.item.i] + '</span><span class="t">' + esc(d.item.geo.label) + '</span></button>').join('');
    const L_ = {
      safety:[['home', 'g_home'], ['vehicle', 'g_vehicle'], ['person', 'g_person'], ['nuisance', 'g_nuisance']].map(x => [GROUP_COLOR[x[0]], GROUPS[x[0]][state.lang]]).concat([[GROUP_COLOR.other, state.lang === 'zh' ? '其他' : 'Other']]),
      schools:[['#2563eb', t('lg_prim')], ['#7c3aed', t('lg_sec')], ['#0e8aa6', t('lg_nurs')], ['#868e96', t('lg_ind')]],
      life:[['#2f9e44', t('lg_super')], ['#f08c00', t('lg_mall')], ['#e03131', t('lg_asian')], ['#7048e8', t('lg_sport')], ['#212529', t('lg_station')], ['#adb5bd', t('lg_food')]],
      roads:[['#e03131', t('lg_motor')], ['#f08c00', t('lg_trunk')]]
    }[state.topic];
    $('#legend').innerHTML = L_.map(x => '<span><i style="background:' + x[0] + '"></i>' + esc(x[1]) + '</span>').join('') + (state.topic === 'safety' ? '<span>' + esc(t('lg_dots')) + '</span>' : '');
    updateMap();
  }
}

/* ---------- map ---------- */
let map = null, layer = null;
const PIN_COLOR = ['#2563eb', '#7c3aed', '#0e8aa6'];
function updateMap(){
  if (!window.L) return;
  const ds = state.digests;
  const sel = ds.find(d => d.item.i === state.mapIdx) || ds[0];
  if (!sel) return;
  if (!map){
    map = L.map('map', {scrollWheelZoom:false});
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
  }
  if (layer) layer.remove();
  layer = L.layerGroup().addTo(map);
  const g = sel.item.geo;
  const bounds = L.latLngBounds([[g.lat, g.lng]]);
  const dot = (la, ln, color, r, name, d) => {
    const m = L.circleMarker([la, ln], {radius:r, weight:1, color:'#fff', fillColor:color, fillOpacity:.85});
    m.bindPopup('<b>' + esc(name || '') + '</b>' + (d != null ? '<br>' + esc(fmtDist(d)) : '')).addTo(layer);
    bounds.extend([la, ln]);
  };
  let ring = null;
  if (state.topic === 'safety' && sel.an){
    const dots = sel.an.dots, step = Math.max(1, Math.ceil(dots.length / 3000));
    for (let k = 0; k < dots.length; k += step){
      const x = dots[k];
      L.circleMarker([x.la, x.ln], {radius:3.2, weight:0, fillColor:GROUP_COLOR[(CATS[x.c] || {group:'other'}).group], fillOpacity:.55, interactive:false}).addTo(layer);
    }
    ring = L.circle([g.lat, g.lng], {radius:sel.an.R, color:PIN_COLOR[sel.item.i], weight:2, fillOpacity:.04, interactive:false}).addTo(layer);
    bounds.extend(ring.getBounds());
  } else if (state.topic === 'schools' && sel.pl){
    const p = sel.pl;
    p.prim.filter(s => s.d <= 3200).slice(0, 25).forEach(s => dot(s.la, s.ln, '#2563eb', 7, s.name, s.d));
    p.sec.filter(s => s.d <= 4800).slice(0, 25).forEach(s => dot(s.la, s.ln, '#7c3aed', 7, s.name, s.d));
    p.nurs.slice(0, 10).forEach(s => dot(s.la, s.ln, '#0e8aa6', 5, s.name, s.d));
    p.indep.slice(0, 10).forEach(s => dot(s.la, s.ln, '#868e96', 5, s.name, s.d));
    ring = L.circle([g.lat, g.lng], {radius:MI, color:PIN_COLOR[sel.item.i], weight:1.5, dashArray:'5 6', fillOpacity:0, interactive:false}).addTo(layer);
  } else if (state.topic === 'life' && sel.pl){
    const p = sel.pl;
    p.supers.slice(0, 8).forEach(s => dot(s.la, s.ln, s.asian ? '#e03131' : '#2f9e44', 7, s.name, s.d));
    p.malls.slice(0, 4).forEach(s => dot(s.la, s.ln, '#f08c00', 8, s.name, s.d));
    p.asianFood.slice(0, 8).forEach(s => dot(s.la, s.ln, '#e03131', 6, s.name, s.d));
    p.sports.slice(0, 8).forEach(s => dot(s.la, s.ln, '#7048e8', 6, s.name || t('t_' + s.type), s.d));
    p.stations.slice(0, 4).forEach(s => dot(s.la, s.ln, '#212529', 7, s.name, s.d));
    p.foodList.slice(0, 150).forEach(s => dot(s.la, s.ln, '#adb5bd', 3, s.name, s.d));
    ring = L.circle([g.lat, g.lng], {radius:800, color:PIN_COLOR[sel.item.i], weight:1.5, dashArray:'5 6', fillOpacity:0, interactive:false}).addTo(layer);
    bounds.extend(ring.getBounds());
  } else if (state.topic === 'roads' && sel.roads){
    sel.roads.lines.forEach(l => { L.polyline(l.pts, {color:l.kind === 'motorway' ? '#e03131' : '#f08c00', weight:4, opacity:.8, interactive:false}).addTo(layer); });
    ring = L.circle([g.lat, g.lng], {radius:3000, color:PIN_COLOR[sel.item.i], weight:1.5, dashArray:'5 6', fillOpacity:0, interactive:false}).addTo(layer);
    bounds.extend(ring.getBounds());
  }
  ds.forEach(d => {
    const icon = L.divIcon({className:'', html:'<div class="pin" style="background:' + PIN_COLOR[d.item.i] + '"><b>' + LETTERS[d.item.i] + '</b></div>', iconSize:[28, 28], iconAnchor:[14, 28]});
    L.marker([d.item.geo.lat, d.item.geo.lng], {icon, title:d.item.geo.label}).addTo(layer);
  });
  if (!ring) ring = L.circle([g.lat, g.lng], {radius:600, weight:0, fillOpacity:0, interactive:false}).addTo(layer);
  setTimeout(() => {
    map.invalidateSize();
    if (bounds.isValid() && bounds.getSouthWest().distanceTo(bounds.getNorthEast()) > 50) map.fitBounds(bounds, {padding:[16, 16], maxZoom:17});
    else map.setView([g.lat, g.lng], 16);
  }, 60);
}

/* ---------- ui wiring ---------- */
function applyLang(){
  document.documentElement.lang = state.lang === 'zh' ? 'zh-HK' : 'en';
  $$('[data-i18n]').forEach(n => n.textContent = t(n.dataset.i18n));
  $$('[data-i18n-ph]').forEach(n => n.placeholder = t(n.dataset.i18nPh));
  $('#lang-en').setAttribute('aria-pressed', state.lang === 'en');
  $('#lang-zh').setAttribute('aria-pressed', state.lang === 'zh');
  if (state.running) renderStatus();
  else if (state.items.length) render();
}
function setLang(l){
  state.lang = l;
  try{ localStorage.setItem('nest-lang', l); }catch(e){}
  applyLang();
}
(function init(){
  let saved = null;
  try{ saved = localStorage.getItem('nest-lang'); }catch(e){}
  state.lang = saved || (/^zh/i.test(navigator.language || '') ? 'zh' : 'en');
  applyLang();
  $('#lang-en').onclick = () => setLang('en');
  $('#lang-zh').onclick = () => setLang('zh');
  $('#form').addEventListener('submit', e => { e.preventDefault(); run(); });
  $('#addMore').onclick = () => {
    const r = ['row1', 'row2'].map(id => $('#' + id)).find(n => n.hidden);
    if (r){ r.hidden = false; $('input', r).focus(); }
    if (!['row1', 'row2'].map(id => $('#' + id)).some(n => n.hidden)) $('#addMore').hidden = true;
  };
  $('#ex1').onclick = () => {
    $('#q0').value = 'GU1 2TN'; $('#q1').value = 'GU15 3SZ';
    $('#row1').hidden = false;
  };
  $$('input[name=radius]').forEach(r => r.onchange = () => { state.radius = +r.value; if (!state.running && state.items.length) render(); });
  $('#profile').onchange = e => { state.profile = e.target.value; if (!state.running && state.items.length) render(); };
  $('#topics').addEventListener('click', e => {
    const b = e.target.closest('button[data-topic]'); if (!b) return;
    state.topic = b.dataset.topic; render();
  });
  $('#maptabs').addEventListener('click', e => {
    const b = e.target.closest('button[data-i]'); if (!b) return;
    state.mapIdx = +b.dataset.i;
    $$('#maptabs button').forEach(x => x.setAttribute('aria-pressed', x === b));
    updateMap();
  });
  $('#results').addEventListener('click', e => {
    const b = e.target.closest('button[data-retry]'); if (!b) return;
    const parts = b.dataset.retry.split(':');
    b.disabled = true;
    retry(+parts[0], parts[1]);
  });
})();
</script>
