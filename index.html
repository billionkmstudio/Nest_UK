let streetLayer = null, satLayer = null, satLabels = null;
function applyBase2d(){
  if (!map || !streetLayer) return;
  if (state.base === 'sat'){ streetLayer.remove(); satLayer.addTo(map); satLabels.addTo(map); satLayer.bringToBack(); }
  else { satLayer.remove(); satLabels.remove(); streetLayer.addTo(map); streetLayer.bringToBack(); }
}
let map = null, mapLayer = null, ukmap = null, ukDot = null, lastFit2 = '';
function ensureMap2d(){
  if (!window.L){ mapNote(t('errLeaflet')); return false; }
  if (!map){
    map = L.map('map', {scrollWheelZoom:false, zoomControl:false});
    L.control.zoom({position:'bottomright'}).addTo(map);
    streetLayer = L.tileLayer(OSM_TILES, {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
    satLayer = L.tileLayer(SAT_URL, {maxZoom:19, maxNativeZoom:18, attribution:SAT_ATTR.replace('©', '&copy;')});
    satLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, maxNativeZoom:18, opacity:.95});
    applyBase2d();
  }
  return true;
}
function draw2d(sel, sc, ds, fitKey){
  if (!ensureMap2d()) return;
  if (mapLayer) mapLayer.remove();
  mapLayer = L.layerGroup().addTo(map);
  const g = sel.item.geo;
  sc.lines.forEach(l => {
    const c = LAYERS[l.layer];
    L.polyline(l.pts, {color:c.color, weight:c.w, opacity:.85}).bindPopup('<b>' + esc(l.name) + '</b><br>' + esc(t(c.key))).addTo(mapLayer);
  });
  sc.crime.forEach(x => L.circleMarker([x.la, x.ln], {radius:3.2, weight:0, fillColor:x.color, fillOpacity:.55, interactive:false}).addTo(mapLayer));
  sc.pts.forEach(p => L.circleMarker([p.la, p.ln], {radius:p.r, weight:1.5, color:'#fff', fillColor:LAYERS[p.layer].color, fillOpacity:.92}).bindPopup(popupHTML(p.name, p.layer, p.d, p.extra)).addTo(mapLayer));
  L.circle([g.lat, g.lng], {radius:sc.ring.r, color:sc.ring.color, weight:2, dashArray:'5 6', fillOpacity:.03, interactive:false}).addTo(mapLayer);
  ds.forEach(x => {
    const icon = L.divIcon({className:'', html:pinHTML(x.item.i), iconSize:[28, 28], iconAnchor:[14, 28]});
    L.marker([x.item.geo.lat, x.item.geo.lng], {icon, title:x.item.geo.label, zIndexOffset:1000}).addTo(mapLayer);
  });
  setTimeout(() => {
    if (!map) return;
    map.invalidateSize();
    if (fitKey !== lastFit2){
      lastFit2 = fitKey;
      const b = bboxFor(g, sc.ring.r * 1.08);
      map.fitBounds([[b.s, b.w], [b.n, b.e]], {padding:[16, 16], maxZoom:17});
    }
  }, 60);
}


/* ---------- live buses (BODS via Vercel proxy) ---------- */
const POLL_MS = 15000;
const live = {n:0, veh:new Map(), timer:null, raf:0, key:'', err:'', ts:0, loaded:false, busy:false, layer2:null, lastDraw:0};
function liveEligible(sel){ const c = sel && sel.item.geo.country; return !c || c === 'England'; }
function liveSel(){
  const s = getDigests().find(d => d.item.i === state.mapIdx);
  if (s) return s;
  return document.body.classList.contains('landing') ? {item:{i:-1, geo:LONDON}} : null;
}
function liveAct(){ return LIVE_ON && state.layers.has('buslive') && !document.hidden && !!liveSel(); }
function liveHTML(v){
  return '<b>' + esc(t('live_pop')) + ' ' + esc(v.line) + '</b>' + (v.dest ? '<br>' + esc(t('live_to')) + ' ' + esc(v.dest) : '') + (v.op ? '<br><small>' + esc(v.op) + '</small>' : '');
}
function liveClear(){
  live.veh.forEach(v => { if (v.m2){ v.m2.remove(); } if (v.m3){ v.m3.remove(); } });
  live.veh.clear(); live.n = 0;
}
function liveBar(){
  const b = $('#livebar');
  const chip = $('#layers .lyr[data-layer="buslive"]');
  if (chip && live.loaded){ let c = $('.cn', chip); if (!c){ c = document.createElement('span'); c.className = 'cn'; chip.append(' ', c); } c.textContent = live.n; }
  if (!LIVE_ON || !state.layers.has('buslive') || !liveSel()){ b.hidden = true; return; }
  const sel = liveSel();
  b.hidden = false;
  let txt;
  if (sel && !liveEligible(sel)) txt = t('live_out');
  else if (live.err) txt = t('live_err', {e:live.err});
  else if (!live.loaded) txt = t('live_load');
  else if (!live.n) txt = t('live_none');
  else txt = t('live_n', {n:live.n, time:new Date(live.ts || Date.now()).toLocaleTimeString(state.lang === 'zh' ? 'zh-HK' : 'en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit'})});
  b.innerHTML = (live.n && !live.err ? '<i class="dot"></i>' : '') + esc(txt) + '<br><small>' + esc(t('live_note')) + '</small>';
}
function liveMarker(v){
  const view = state.view;
  if (view === '2d' && map){
    if (!live.layer2) live.layer2 = L.layerGroup().addTo(map);
    const icon = L.divIcon({className:'', html:'<div class="bus">' + esc(v.line) + '</div>', iconSize:null});
    v.m2 = L.marker(v.cur, {icon, zIndexOffset:500}).bindPopup(liveHTML(v)).addTo(live.layer2);
  } else if (view === '3d' && map3 && ready3){
    const el = document.createElement('div'); el.innerHTML = '<div class="bus">' + esc(v.line) + '</div>';
    v.m3 = new maplibregl.Marker({element:el, anchor:'center'}).setLngLat([v.cur[1], v.cur[0]])
      .setPopup(new maplibregl.Popup({offset:10}).setHTML(liveHTML(v))).addTo(map3);
  }
}
function liveDropMarkers(){
  live.veh.forEach(v => { if (v.m2){ v.m2.remove(); v.m2 = null; } if (v.m3){ v.m3.remove(); v.m3 = null; } });
  if (live.layer2){ live.layer2.remove(); live.layer2 = null; }
}
function liveRebuild(){   // after view switch / map redraw
  liveDropMarkers();
  if (liveAct()) live.veh.forEach(v => liveMarker(v));
}
function applyLive(j){
  const now = performance.now(), seen = new Set();
  const sel = liveSel(), g = sel.item.geo;
  const list = (j.vehicles || []).slice().sort((a, b) =>
    ((a.lat - g.lat) ** 2 + ((a.lng - g.lng) * .63) ** 2) - ((b.lat - g.lat) ** 2 + ((b.lng - g.lng) * .63) ** 2)).slice(0, 150);
  list.forEach(x => {
    seen.add(x.id);
    let v = live.veh.get(x.id);
    const to = [x.lat, x.lng];
    if (v){
      v.from = v.cur.slice(); v.to = to; v.t0 = now; v.t1 = now + POLL_MS; v.line = x.line; v.dest = x.dest; v.op = x.op;
      if (v.m2) v.m2.setPopupContent(liveHTML(v));
    } else {
      v = {id:x.id, line:x.line, dest:x.dest, op:x.op, cur:to.slice(), from:to.slice(), to, t0:now, t1:now};
      live.veh.set(x.id, v);
      if (liveAct()) liveMarker(v);
    }
  });
  live.veh.forEach((v, id) => { if (!seen.has(id)){ if (v.m2) v.m2.remove(); if (v.m3) v.m3.remove(); live.veh.delete(id); } });
  live.n = live.veh.size; live.ts = j.ts ? Date.parse(j.ts) || Date.now() : Date.now();
  if (!isFinite(live.ts)) live.ts = Date.now();
}
function liveFrame(){
  live.raf = 0;
  if (!liveAct()) return;
  const now = performance.now();
  if (now - live.lastDraw > 60){
    live.lastDraw = now;
    live.veh.forEach(v => {
      const k = v.t1 > v.t0 ? Math.min(1, Math.max(0, (now - v.t0) / (v.t1 - v.t0))) : 1;
      v.cur = [v.from[0] + (v.to[0] - v.from[0]) * k, v.from[1] + (v.to[1] - v.from[1]) * k];
      if (v.m2) v.m2.setLatLng(v.cur);
      if (v.m3) v.m3.setLngLat([v.cur[1], v.cur[0]]);
    });
  }
  live.raf = requestAnimationFrame(liveFrame);
}
async function pollLive(){
  if (live.busy || !liveAct()) return;
  const sel = liveSel();
  if (!liveEligible(sel)){ liveBar(); return; }
  live.busy = true;
  const key = sel.item.i + '|' + sel.item.geo.lat + ',' + sel.item.geo.lng;
  const b = bboxFor(sel.item.geo, 3000);
  try{
    const r = await fetchT(BUS_API + (BUS_API.includes('?') ? '&' : '?') + 'bbox=' + [b.w, b.s, b.e, b.n].map(x => x.toFixed(5)).join(','), {headers:{Accept:'application/json'}}, 20000);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (key !== live.key) return;           // user moved on while waiting
    live.err = ''; live.loaded = true;
    applyLive(j);
  }catch(e){
    if (key === live.key) live.err = e && e.name === 'AbortError' ? 'timeout' : (e && e.message) || 'error';
  }finally{ live.busy = false; }
  liveBar();
}
function syncLive(){
  if (!LIVE_ON) return;
  const sel = liveSel();
  const key = sel ? sel.item.i + '|' + sel.item.geo.lat + ',' + sel.item.geo.lng : '';
  if (key !== live.key){ liveClear(); live.key = key; live.err = ''; live.loaded = false; }
  liveBar();
  if (!liveAct()){
    liveDropMarkers();
    if (live.timer){ clearInterval(live.timer); live.timer = null; }
    return;
  }
  liveRebuild();
  if (!live.timer){ live.timer = setInterval(pollLive, POLL_MS); }
  if (!live.loaded) pollLive();
  if (!live.raf) live.raf = requestAnimationFrame(liveFrame);
}
if (LIVE_ON) document.addEventListener('visibilitychange', () => { if (!document.hidden){ live.loaded = live.loaded && !!live.n; pollLive(); } syncLive(); });

/* UK locator */
function updateUK(g){
  if (!window.L) return;
  if (!ukmap){
    ukmap = L.map('ukmap', {zoomControl:false, attributionControl:false, dragging:false, scrollWheelZoom:false, doubleClickZoom:false, boxZoom:false, keyboard:false, touchZoom:false, tap:false});
    L.tileLayer(OSM_TILES, {maxZoom:19}).addTo(ukmap);
    ukmap.setView([54.6, -3.2], 3);
  }
  if (ukDot) ukDot.remove();
  ukDot = L.circleMarker([g.lat, g.lng], {radius:6, weight:2, color:'#fff', fillColor:'#e03131', fillOpacity:1, interactive:false}).addTo(ukmap);
  setTimeout(() => { if (ukmap) ukmap.invalidateSize(); }, 80);
}

/* 3D */
let map3 = null, ready3 = false, pins3 = [], lastFit3 = '';
const EMPTY_FC = {type:'FeatureCollection', features:[]};
function loadScript(src){
  return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error('script')); document.head.appendChild(el); });
}
function webglOK(){
  try{ const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); }catch(e){ return false; }
}
async function ensure3d(){
  if (map3) return true;
  if (!webglOK()){ mapNote(t('err3d'), 8000); return false; }
  mapNote(t('load3d'));
  try{ if (!window.maplibregl) await loadScript('https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js'); }
  catch(e){ mapNote(t('err3d'), 8000); return false; }
  const sel = getDigests().find(d => d.item.i === state.mapIdx) || getDigests()[0];
  if (!sel) return false;
  const g = sel.item.geo;
  try{
    map3 = new maplibregl.Map({container:'map3d', style:'https://tiles.openfreemap.org/styles/liberty', center:[g.lng, g.lat], zoom:14, pitch:52, bearing:-20, maxPitch:80, attributionControl:{compact:true}});
  }catch(e){ map3 = null; mapNote(t('err3d'), 8000); return false; }
  map3.addControl(new maplibregl.NavigationControl({visualizePitch:true}), 'bottom-right');
  map3.on('load', () => {
    map3.addSource('sat', {type:'raster', tiles:[SAT_URL], tileSize:256, maxzoom:18, attribution:SAT_ATTR});
    map3.addLayer({id:'sat', type:'raster', source:'sat', layout:{visibility:state.base === 'sat' ? 'visible' : 'none'}});
    map3.addSource('crime', {type:'geojson', data:EMPTY_FC});
    map3.addSource('ring', {type:'geojson', data:EMPTY_FC});
    map3.addSource('lines', {type:'geojson', data:EMPTY_FC});
    map3.addSource('pts', {type:'geojson', data:EMPTY_FC});
    map3.addLayer({id:'crime', type:'circle', source:'crime', paint:{'circle-radius':3, 'circle-color':['get', 'color'], 'circle-opacity':.6}});
    map3.addLayer({id:'ring', type:'line', source:'ring', paint:{'line-color':['get', 'color'], 'line-width':2.5, 'line-dasharray':[2, 2]}});
    map3.addLayer({id:'lines', type:'line', source:'lines', layout:{'line-cap':'round', 'line-join':'round'}, paint:{'line-color':['get', 'color'], 'line-width':['interpolate', ['linear'], ['zoom'], 10, ['*', ['get', 'w'], .5], 16, ['*', ['get', 'w'], 1.6]], 'line-opacity':.9}});
    map3.addLayer({id:'pts', type:'circle', source:'pts', paint:{'circle-radius':['get', 'r'], 'circle-color':['get', 'color'], 'circle-stroke-color':'#fff', 'circle-stroke-width':1.5, 'circle-opacity':.95}});
    ['pts', 'lines'].forEach(id => {
      map3.on('click', id, e => { const f = e.features && e.features[0]; if (f) new maplibregl.Popup({offset:8}).setLngLat(e.lngLat).setHTML(f.properties.html).addTo(map3); });
      map3.on('mouseenter', id, () => { map3.getCanvas().style.cursor = 'pointer'; });
      map3.on('mouseleave', id, () => { map3.getCanvas().style.cursor = ''; });
    });
    ready3 = true; mapNote('');
    refreshMap();
  });
  map3.on('error', () => { if (!ready3) mapNote(t('err3d'), 8000); });
  return true;
}
function applyBase3d(){
  if (map3 && ready3 && map3.getLayer('sat')) map3.setLayoutProperty('sat', 'visibility', state.base === 'sat' ? 'visible' : 'none');
}
function setBase(b){
  state.base = b;
  $('#bmap').setAttribute('aria-pressed', b === 'map');
  $('#bsat').setAttribute('aria-pressed', b === 'sat');
  $('#mapbox').classList.toggle('sat', b === 'sat');
  $('#satcredit').hidden = b !== 'sat'; $('#satcredit').textContent = SAT_ATTR;
  applyBase2d(); applyBase3d();
}
function draw3d(sel, sc, ds, fitKey){
  if (!map3 || !ready3) return;
  const g = sel.item.geo;
  const feat = (geom, props) => ({type:'Feature', geometry:geom, properties:props});
  map3.getSource('pts').setData({type:'FeatureCollection', features:sc.pts.map(p => feat({type:'Point', coordinates:[p.ln, p.la]}, {color:LAYERS[p.layer].color, r:p.r, html:popupHTML(p.name, p.layer, p.d, p.extra)}))});
  map3.getSource('lines').setData({type:'FeatureCollection', features:sc.lines.map(l => feat({type:'LineString', coordinates:l.pts.map(q => [q[1], q[0]])}, {color:LAYERS[l.layer].color, w:LAYERS[l.layer].w, html:'<b>' + esc(l.name) + '</b><br>' + esc(t(LAYERS[l.layer].key))}))});
  map3.getSource('crime').setData({type:'FeatureCollection', features:sc.crime.map(x => feat({type:'Point', coordinates:[x.ln, x.la]}, {color:x.color}))});
  map3.getSource('ring').setData({type:'FeatureCollection', features:[feat({type:'LineString', coordinates:circleCoords(g, sc.ring.r)}, {color:sc.ring.color})]});
  pins3.forEach(m => m.remove()); pins3 = [];
  ds.forEach(x => {
    const el = document.createElement('div'); el.innerHTML = pinHTML(x.item.i);
    pins3.push(new maplibregl.Marker({element:el, anchor:'bottom'}).setLngLat([x.item.geo.lng, x.item.geo.lat]).addTo(map3));
  });
  if (fitKey !== lastFit3){
    lastFit3 = fitKey;
    const b = bboxFor(g, sc.ring.r * 1.3);
    map3.fitBounds([[b.w, b.s], [b.e, b.n]], {padding:36, pitch:52, bearing:-20, maxZoom:15.8, duration:700});
  }
}
async function setView(v){
  state.view = v;
  $('#v2d').setAttribute('aria-pressed', v === '2d');
  $('#v3d').setAttribute('aria-pressed', v === '3d');
  $('#mapbox').classList.toggle('is3d', v === '3d');
  if (v === '3d'){
    const ok = await ensure3d();
    if (!ok){ setView('2d'); return; }
    lastFit3 = '';
    if (ready3) refreshMap(); else if (map3) map3.resize();
  } else {
    lastFit2 = '';
    if (map) setTimeout(() => map.invalidateSize(), 30);
    refreshMap();
  }
}

function renderLayers(sc){
  $('#layers').innerHTML = LAYER_GROUPS.map(([keys, nameKey]) =>
    '<div class="lgrp"><b>' + esc(t(nameKey)) + '</b>' + keys.map(k => {
      const L_ = LAYERS[k], on = state.layers.has(k), n = sc.counts[k];
      return '<button type="button" class="lyr" data-layer="' + k + '" aria-pressed="' + on + '" style="--c:' + L_.color + '"><i class="' + (L_.line ? 'ln' : '') + '"></i>' + esc(t(L_.key)) + (n != null ? ' <span class="cn">' + n + '</span>' : '') + '</button>';
    }).join('') + '</div>').join('');
  $('#legend').innerHTML = state.layers.has('crime')
    ? [['home', 'g_home'], ['vehicle', 'g_vehicle'], ['person', 'g_person'], ['nuisance', 'g_nuisance']].map(x => '<span><i style="background:' + GROUP_COLOR[x[0]] + '"></i>' + esc(GROUPS[x[0]][state.lang]) + '</span>').join('') + '<span><i style="background:' + GROUP_COLOR.other + '"></i>' + esc(state.lang === 'zh' ? '其他' : 'Other') + '</span><span>' + esc(t('lg_dots')) + '</span>'
    : '';
}
function showLanding(){
  const box = $('#mapcard');
  box.hidden = false;
  document.body.classList.add('two', 'landing');
  if (state.view !== '2d'){ state.view = '2d'; $('#v2d').setAttribute('aria-pressed', 'true'); $('#v3d').setAttribute('aria-pressed', 'false'); $('#mapbox').classList.remove('is3d'); }
  $('#loc').textContent = '';
  $('#ukcap').textContent = LONDON.label;
  $('#layers').innerHTML = LIVE_ON ? '<div class="lgrp"><b>' + esc(t('lgrp_transport')) + '</b><button type="button" class="lyr" data-layer="buslive" aria-pressed="' + state.layers.has('buslive') + '" style="--c:' + LAYERS.buslive.color + '"><i></i>' + esc(t('lg_buslive')) + (live.loaded ? ' <span class="cn">' + live.n + '</span>' : '') + '</button></div>' : '';
  $('#legend').innerHTML = '';
  updateUK(LONDON);
  if (ensureMap2d()){
    if (mapLayer) mapLayer.remove();
    mapLayer = L.layerGroup().addTo(map);
    if (lastFit2 !== 'landing'){ lastFit2 = 'landing'; map.setView([LONDON.lat, LONDON.lng], 12); }
    setTimeout(() => { if (map) map.invalidateSize(); }, 80);
  }
  syncLive();
}
function relayoutMaps(){ if (map) map.invalidateSize(); if (ukmap) ukmap.invalidateSize(); if (map3) map3.resize(); }
window.addEventListener('resize', () => { clearTimeout(relayoutMaps.t); relayoutMaps.t = setTimeout(relayoutMaps, 150); });
function refreshMap(){
  const ds = getDigests();
  const box = $('#mapcard');
  if (!ds.length){
    if (canLanding()){ showLanding(); return; }
    box.hidden = true; document.body.classList.remove('two'); return;
  }
  if (document.body.classList.contains('landing') && window.innerWidth >= 900){ document.body.classList.add('lyroff'); $('#layersBtn').setAttribute('aria-pressed', 'false'); }
  document.body.classList.remove('landing');
  const wasHidden = box.hidden;
  box.hidden = false;
  const wasTwo = document.body.classList.contains('two');
  document.body.classList.add('two');
  if (!wasTwo){
    if (window.innerWidth >= 900){ document.body.classList.add('lyroff'); $('#layersBtn').setAttribute('aria-pressed', 'false'); }
    setTimeout(relayoutMaps, 80);
  }
  if (!ds.some(d => d.item.i === state.mapIdx)) state.mapIdx = ds[0].item.i;
  const sel = ds.find(d => d.item.i === state.mapIdx);
  const tabs = $('#maptabs');
  tabs.hidden = ds.length < 2;
  tabs.innerHTML = ds.map(d => '<button type="button" data-i="' + d.item.i + '" aria-pressed="' + (d.item.i === state.mapIdx) + '"><span class="chip ' + IDCLS[d.item.i] + '">' + LETTERS[d.item.i] + '</span><span class="t">' + esc(d.item.geo.label) + '</span></button>').join('');
  const g = sel.item.geo;
  $('#loc').textContent = t('locLine', {name:[g.label, g.place].filter(Boolean).join(' · '), lat:g.lat.toFixed(4), lng:g.lng.toFixed(4)});
  $('#ukcap').textContent = g.place || g.label;
  const sc = buildScene(sel);
  renderLayers(sc);
  const fitKey = sel.item.i + '|' + state.topic + '|' + g.lat + ',' + g.lng + '|' + sc.ring.r;
  updateUK(g);
  if (state.view === '3d') draw3d(sel, sc, ds, fitKey);
  else draw2d(sel, sc, ds, fitKey);
  syncLive();
  if (wasHidden) setTimeout(() => { if (map) map.invalidateSize(); if (ukmap) ukmap.invalidateSize(); }, 120);
}

/* ---------- ui wiring ---------- */
function applyLang(){
  document.documentElement.lang = state.lang === 'zh' ? 'zh-HK' : 'en';
  $$('[data-i18n]').forEach(n => n.textContent = t(n.dataset.i18n));
  $$('[data-i18n-ph]').forEach(n => n.placeholder = t(n.dataset.i18nPh));
  if (state.theme) applyTheme(state.theme);
  sideLabel();
  $('#lang-en').setAttribute('aria-pressed', state.lang === 'en');
  $('#lang-zh').setAttribute('aria-pressed', state.lang === 'zh');
  if (state.running) renderStatus();
  else if (state.items.length) render();
}
function setLang(l){
  state.lang = l;
  try{ localStorage.setItem('nest-lang', l); }catch(e){}
  applyLang();
}
function sideLabel(){
  const hid = document.body.classList.contains('sidehide'), b = $('#sideBtn');
  b.textContent = hid ? '▶ ' + t('side_show') : '◀ ' + t('side_hide');
  b.setAttribute('aria-label', b.textContent);
}
function applyTheme(th){
  document.documentElement.setAttribute('data-theme', th);
  const b = $('#themeBtn');
  b.textContent = th === 'dark' ? '☀' : '☾';
  const lbl = t(th === 'dark' ? 'theme_to_light' : 'theme_to_dark');
  b.setAttribute('aria-label', lbl); b.title = lbl;
}
(function init(){
  let th = null;
  try{ th = localStorage.getItem('nest-theme'); }catch(e){}
  if (th !== 'dark' && th !== 'light') th = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  state.theme = th;
  $('#ver').textContent = 'Nest UK v' + (window.NEST_VERSION || '1.0.0') + (window.NEST_BUILD ? ' (' + window.NEST_BUILD + ')' : '');
  let saved = null;
  try{ saved = localStorage.getItem('nest-lang'); }catch(e){}
  state.lang = saved || (/^zh/i.test(navigator.language || '') ? 'zh' : 'en');
  applyLang();
  $('#lang-en').onclick = () => setLang('en');
  $('#lang-zh').onclick = () => setLang('zh');
  $('#form').addEventListener('submit', e => { e.preventDefault(); run(); });
  $('#addMore').onclick = () => {
    const r = ['row1', 'row2'].map(id => $('#' + id)).find(n => n.hidden);
    if (r){ r.hidden = false; $('input', r).focus(); }
    if (!['row1', 'row2'].map(id => $('#' + id)).some(n => n.hidden)) $('#addMore').hidden = true;
  };
  $('#ex1').onclick = () => {
    $('#q0').value = 'GU1 2TN'; $('#q1').value = 'GU15 3SZ';
    $('#row1').hidden = false;
  };
  $$('input[name=radius]').forEach(r => r.onchange = () => { state.radius = +r.value; if (!state.running && state.items.length) render(); });
  $('#profile').onchange = e => { state.profile = e.target.value; if (!state.running && state.items.length) render(); };
  $('#topics').addEventListener('click', e => {
    const b = e.target.closest('button[data-topic]'); if (!b) return;
    state.topic = b.dataset.topic; setTopicLayers(state.topic); render();
  });
  $('#maptabs').addEventListener('click', e => {
    const b = e.target.closest('button[data-i]'); if (!b) return;
    state.mapIdx = +b.dataset.i;
    refreshMap();
  });
  $('#layers').addEventListener('click', e => {
    const b = e.target.closest('button[data-layer]'); if (!b) return;
    const k = b.dataset.layer;
    if (state.layers.has(k)) state.layers.delete(k); else state.layers.add(k);
    refreshMap();
  });
  $('#themeBtn').onclick = () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; try{ localStorage.setItem('nest-theme', state.theme); }catch(e){} applyTheme(state.theme); };
  $('#sideBtn').onclick = () => { document.body.classList.toggle('sidehide'); sideLabel(); setTimeout(relayoutMaps, 60); };
  $('#layersBtn').onclick = () => { const off = document.body.classList.toggle('lyroff'); $('#layersBtn').setAttribute('aria-pressed', !off); };
  $('#bmap').onclick = () => setBase('map');
  $('#bsat').onclick = () => setBase('sat');
  $('#v2d').onclick = () => setView('2d');
  $('#v3d').onclick = () => setView('3d');
  if (canLanding()){ state.layers = new Set(LIVE_ON ? ['buslive'] : []); showLanding(); }
  $('#results').addEventListener('click', e => {
    const b = e.target.closest('button[data-retry]'); if (!b) return;
    const parts = b.dataset.retry.split(':');
    b.disabled = true;
    retry(+parts[0], parts[1]);
  });
})();
</script>
</body>
</html>
