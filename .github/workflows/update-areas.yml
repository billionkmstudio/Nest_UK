name: Update area pages data

# Rebuilds public/data/areas.json (crime and school numbers for the /uk/... pages) once a month, after police.uk
# publishes the latest month, and on demand from the Actions tab. Cloudflare redeploys when the file is committed.
on:
  schedule:
    - cron: '23 6 22 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the area statistics (about 600 police.uk requests)
        run: node scripts/build-areas.mjs

      - name: Test
        run: node scripts/test-seo.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- public/data/areas.json)" ]; then
            echo "No change in area data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/areas.json
            git commit -m "Update area page data"
            git push
          fi
