name: Update area pages data

# Rebuilds public/data/areas/ (crime and school numbers for the /uk/... pages, one file per region in scripts/areas/) once a
# month, after police.uk publishes the latest month, and on demand from the Actions tab (optionally for one region).
# Cloudflare redeploys when the files are committed.
on:
  schedule:
    - cron: '23 6 22 * *'
  workflow_dispatch:
    inputs:
      region:
        description: 'Build one region only, e.g. surrey. Leave empty for every enabled region.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the area statistics (about 12 police.uk requests per place)
        env:
          REGION: ${{ inputs.region }}
        run: node scripts/build-areas.mjs "$REGION"

      - name: Test
        run: node scripts/test-seo.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- public/data/areas)" ]; then
            echo "No change in area data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/areas
            git commit -m "Update area page data"
            git push
          fi
